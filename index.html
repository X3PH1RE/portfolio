<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Coming Soon – Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: #fafafa;
      color: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    .wrapper {
      max-width: 640px;
      width: 100%;
      background: #ffffff;
      border-radius: 18px;
      border: 1px solid #e5e7eb;
      padding: 32px 28px 20px;
      box-shadow:
        0 18px 60px rgba(15, 23, 42, 0.08),
        0 0 0 1px rgba(15, 23, 42, 0.02);
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px;
      border-radius: 999px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: #6b7280;
      margin-bottom: 18px;
    }

    .tag-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: #22c55e;
    }

    h1 {
      font-size: clamp(2.1rem, 4vw, 2.6rem);
      line-height: 1.1;
      margin-bottom: 10px;
    }

    h1 span {
      font-weight: 600;
      border-bottom: 3px solid #111827;
      padding-bottom: 2px;
    }

    .sub {
      font-size: 0.96rem;
      color: #6b7280;
      max-width: 30rem;
      line-height: 1.6;
      margin-bottom: 18px;
    }

    .line {
      height: 1px;
      width: 100%;
      background: linear-gradient(to right, transparent, #e5e7eb, transparent);
      margin: 18px 0 10px;
    }

    .eta {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: #9ca3af;
      margin-bottom: 10px;
    }

    .eta strong {
      color: #111827;
      font-weight: 600;
    }

    .eta-lower {
      text-transform: none;
      letter-spacing: normal;
    }

    .bottom {
      margin-top: 6px;
      padding-top: 10px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.85rem;
      color: #6b7280;
    }

    .bottom-text strong {
      font-weight: 500;
    }

    .links {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .links a {
      text-decoration: none;
      font-size: 0.9rem;
      color: #111827;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid #e5e7eb;
      background: #f9fafb;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease-out;
    }

    .links a span.icon {
      font-size: 12px;
      opacity: 0.7;
    }

    .links a:hover {
      border-color: #111827;
      background: #111827;
      color: #f9fafb;
      transform: translateY(-1px);
    }

    @media (max-width: 520px) {
      .wrapper {
        padding: 24px 18px 18px;
      }
      .bottom {
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <main class="wrapper">
    <div class="tag">
      <span class="tag-dot"></span>
      quietly under construction
    </div>

    <h1>
      Portfolio <span>coming soon.</span>
    </h1>


    <div class="line"></div>

    <p class="eta">
      status: <strong>in progress</strong> · eta: <strong>soon-ish</strong><span class="eta-lower"> (hopefully)</span>
    </p>

    <footer class="bottom">
      <p class="bottom-text">
        still wanna to talk to me?<strong> (you stalker~)</strong> Here's my
        <strong>LinkedIn</strong> and <strong>Insta</strong>
      </p>
      <div class="links">
        <a href="https://www.linkedin.com/in/ashwinmenon502/" target="_blank" rel="noopener noreferrer">
          <span>LinkedIn</span>
        </a>
        <a href="https://www.instagram.com/ashwin.menon" target="_blank" rel="noopener noreferrer">
          <span>Instagram</span>
        </a>
      </div>
    </footer>
  </main>
</body>
</html>
